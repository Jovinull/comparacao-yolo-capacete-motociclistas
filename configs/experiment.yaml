# Configuração inicial; confirmar com o grupo antes do experimento definitivo.
data_yaml: data/helmet/data.yaml
output_dir: runs

models:
  - name: yolov8n
    weights: yolov8n.pt
  - name: yolo11n
    weights: yolo11n.pt

train:
  imgsz: 640
  epochs: 100
  batch: 16
  device: "0"
  workers: 8
  seed: 42
  deterministic: true
  pretrained: true
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  patience: 20
  close_mosaic: 10
  cache: false
  amp: true
  plots: true

evaluation:
  split: test
  imgsz: 640
  batch: 16
  conf: 0.001
  iou: 0.7
  max_det: 300
  plots: true

paired_analysis:
  class_id: 1
  confidence: 0.25
  iou_match: 0.5
  bootstrap_samples: 10000
  seed: 42
