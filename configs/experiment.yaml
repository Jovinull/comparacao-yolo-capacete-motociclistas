# Configuração inicial; confirmar com o grupo antes do experimento definitivo.
data_yaml: data/helmet/data.yaml
output_dir: runs

models:
  - name: yolov8n
    weights: yolov8n.pt
  - name: yolo11n
    weights: yolo11n.pt

train:
  imgsz: 640
  epochs: 100
  batch: 16
  device: "0"
  workers: 8
  seed: 42
  deterministic: true
  pretrained: true
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  patience: 20
  close_mosaic: 10
  cache: false
  amp: true
  plots: true

evaluation:
  split: test
  imgsz: 640
  batch: 1
  conf: 0.001
  iou: 0.7
  max_det: 300
  plots: true

threshold_selection:
  confidence_floor: 0.001
  confidence_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  match_iou: 0.5

paired_analysis:
  class_name: motociclista_sem_capacete
  bootstrap_samples: 10000
  seed: 42
