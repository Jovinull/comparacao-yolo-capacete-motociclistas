# Perfil auxiliar de imagens para o computador local. Não substitui o protocolo de vídeos.
dataset_dir: data/edgevision
output_dir: runs/edgevision

budget:
  total_hours: 12
  evaluation_reserve_hours: 3
  max_training_hours_per_model: 4.5

models:
  - name: yolov8n
    weights: yolov8n.pt
  - name: yolo11n
    weights: yolo11n.pt

train:
  imgsz: 640
  epochs: 100
  batch: 4
  device: cpu
  workers: 2
  seed: 42
  deterministic: true
  pretrained: true
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  patience: 20
  close_mosaic: 10
  cache: false
  amp: false
  plots: true

evaluation:
  imgsz: 640
  batch: 1
  device: cpu
  workers: 2
  conf: 0.001
  iou: 0.7
  max_det: 300
  plots: true
  save_json: true
